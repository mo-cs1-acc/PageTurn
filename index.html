<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<link href='https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..800&display=swap' rel='stylesheet'>
	<title>PageTurn</title>
</head>
<body>
	<!-- Adds a blank canvas container for PDF page-->
	<div id="canvas-container"></div>

	<!--these are on top of the PDF-->
	<div id="pdf-overlay">
		<button class="pageturn-button" id="backward-page">←</button>
		<button id="noturn-area"></button>
		<button class="pageturn-button" id="forward-page">→</button>
	</div>

	<div id="info-overlay">
		<!--doesn't really matter where this is-->
		<input type="range" id="page-range" min="1" step="1" />

		<header class="bar" id="top-bar">
			<h1><span id="name-info">PageTurn</span></h1>
		</header>

		<button id="darken-overlay"></button>

		<footer class="bar" id="bottom-bar">
			<div class="bar-section" id="bottom-left">
				<button class="icon-button" id="preview" title="Preview pages">⧉</button>
				<input type="file" accept=".pdf, application/pdf" id="pdf-upload" hidden/>
				<label class="icon-button" id="upload-visible" title="Upload" for="pdf-upload">↥</label>
			</div>
			<div class="bar-section" id="bottom-center">
				<h2><span id="page-info">Upload PDF</span></h2>
			</div>
			<div class="bar-section" id="bottom-right">
				<button class="icon-button" id="pdf-export" title="Export">⤓</button>
				<button class="icon-button" id="settings" title="Settings" popovertarget="settings-popover">⚙</button>
			</div>
		</footer>

	</div>

	<div class="popover-menu" id="settings-popover" popover>
		<h3>Settings</h3>
		<ul class="popover-ul" id="settings-list">
			<li id="cover-onepage">
				<span>Single first page</span>
				<span><label class="switch">
  					<input type="checkbox" id="cover-onepage-toggle">
  					<span class="slider"></span>
				</label></span>
			</li>
			<li id="halfturn">
				<span>Turn half at a time</span>
				<span><label class="switch">
					<input type="checkbox" id="halfturn-toggle">
					<span class="slider"></span>
				</label></span>
			</li>
			<li id="pageturn-areas">
				<button class="settingslist-button" id="turnarea-button">Set turn button areas</button>
			</li>
			<li id="reset-settings">
				<button class="settingslist-button" id="reset-button">Reset all settings</button>

			</li>
		</ul>

	</div>

	<div id="page-preview">	
		<header class="previewbar" id="preview-topbar">
			<div class="bar-section" id="previewtop-left">
				<button class="icon-button" id="close-preview" title="Close preview">×</button>
			</div>
			<div class="bar-section" id="previewtop-center">
				<h1><span class="preview-text">Select pages</span></h1>
			</div>
			<div class="bar-section" id="previewtop-right">

			</div>
		</header>

		<div id="preview-canvascontainer"></div>

		<footer class="previewbar" id="preview-bottombar">
			<button class="previewaction-button" id="crop-button">Crop page</button>
			<button class="previewaction-button" id="autocrop-button">Autocrop selected pages</button>
			<button class="previewaction-button" id="autocropall-button">Autocrop all pages</button>
		</footer>
	</div>


	<script type="module" src="app.js" charset="UTF-8"></script>
</body>
</html>
